server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    server_tokens off;

    # ---------- Siqish ----------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/ld+json
        image/svg+xml
        font/woff2;

    # ---------- Sahifaning o'zi ----------
    location / {
        include /etc/nginx/security-headers.conf;
        # Yangi versiya darrov ko'rinishi uchun HTML keshlanmaydi
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # ---------- Kesh ----------
    # Vite fayl nomiga hash qo'yadi — bu fayllarni uzoq keshlash xavfsiz
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location /fonts/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Hamkorlar ro'yxati va logotiplari tez-tez o'zgarishi mumkin —
    # ular uzoq keshlanmasin, aks holda yangilangani darrov ko'rinmaydi
    location = /partners.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location /partners/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        access_log off;
        try_files $uri =404;
    }

    # Rasm va ikonlar — bir hafta
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    # Xizmat fayllari tashqariga chiqmasin
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Noto'g'ri manzil uchun ham landing ko'rsatiladi, lekin holat kodi 404 qoladi
    error_page 404 /index.html;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
