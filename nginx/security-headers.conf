# Xavfsizlik sarlavhalari.
#
# MUHIM: nginx'da `add_header` location ichida ishlatilsa, yuqori darajadagi
# barcha `add_header` lar o'sha location uchun BEKOR bo'ladi. Shuning uchun bu
# fayl o'z `add_header` i bor har bir location'ga alohida `include` qilinadi.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Sahifa faqat o'z resurslaridan foydalanadi.
# mc.yandex.ru — Metrika yoqilganda kerak (config.ts dagi YANDEX_METRIKA_ID).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru; font-src 'self'; connect-src 'self' https://mc.yandex.ru; frame-src https://mc.yandex.ru; media-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
